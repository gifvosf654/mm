<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iCloud Missive — Unified Mail Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: { blue: '#007AFF', blueHover: '#0062CC' }
                    }
                }
            }
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .selectable-text { user-select: text; }
        .apple-wallpaper {
            background: radial-gradient(circle at 15% 20%, rgba(0, 122, 255, 0.3) 0%, transparent 45%),
                        radial-gradient(circle at 85% 15%, rgba(175, 82, 222, 0.25) 0%, transparent 48%),
                        radial-gradient(circle at 50% 85%, rgba(88, 86, 214, 0.25) 0%, transparent 55%),
                        linear-gradient(145deg, #06080f 0%, #0d1322 50%, #090b12 100%);
        }
        .glass-panel {
            background: rgba(20, 25, 36, 0.75);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .ios-keypad-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.14s ease;
        }
        .ios-keypad-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.94); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.25); border-radius: 9999px; }
    </style>
</head>
<body class="apple-wallpaper text-slate-100 h-screen w-screen overflow-hidden">

    <!-- 1. LOCK SCREEN (PIN: 5109) -->
    <div id="lock-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 transition-all duration-500" style="background: rgba(6, 10, 19, 0.75); backdrop-filter: blur(36px);">
        <div class="w-14 h-14 rounded-2xl bg-apple-blue flex items-center justify-center text-2xl text-white shadow-lg shadow-blue-500/30 mb-3">
            <i class="fa-solid fa-envelope-open-text"></i>
        </div>
        <h2 class="text-lg font-semibold text-white">Unified Mail Vault</h2>
        <p id="pin-msg" class="text-xs text-slate-400 mt-1 mb-6">Enter Passcode (5109) to Access All Inboxes</p>

        <div id="pin-dots" class="flex gap-4 mb-7">
            <div class="dot w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
            <div class="dot w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
            <div class="dot w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
            <div class="dot w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
        </div>

        <div class="grid grid-cols-3 gap-4 w-64">
            <button onclick="pressPin('1')" class="ios-keypad-btn h-16 rounded-full text-2xl">1</button>
            <button onclick="pressPin('2')" class="ios-keypad-btn h-16 rounded-full text-2xl">2</button>
            <button onclick="pressPin('3')" class="ios-keypad-btn h-16 rounded-full text-2xl">3</button>
            <button onclick="pressPin('4')" class="ios-keypad-btn h-16 rounded-full text-2xl">4</button>
            <button onclick="pressPin('5')" class="ios-keypad-btn h-16 rounded-full text-2xl">5</button>
            <button onclick="pressPin('6')" class="ios-keypad-btn h-16 rounded-full text-2xl">6</button>
            <button onclick="pressPin('7')" class="ios-keypad-btn h-16 rounded-full text-2xl">7</button>
            <button onclick="pressPin('8')" class="ios-keypad-btn h-16 rounded-full text-2xl">8</button>
            <button onclick="pressPin('9')" class="ios-keypad-btn h-16 rounded-full text-2xl">9</button>
            <button onclick="resetPin()" class="h-16 rounded-full text-xs text-slate-300">Clear</button>
            <button onclick="pressPin('0')" class="ios-keypad-btn h-16 rounded-full text-2xl">0</button>
            <button onclick="backPin()" class="h-16 rounded-full text-lg text-slate-300"><i class="fa-solid fa-delete-left"></i></button>
        </div>
    </div>

    <!-- 2. MISSIVE 3-PANE UNIFIED INBOX WORKSPACE -->
    <div id="app-workspace" class="h-full w-full p-0 sm:p-3 opacity-0 pointer-events-none transition-all duration-500 flex">
        <div class="glass-panel w-full h-full sm:rounded-3xl shadow-2xl flex overflow-hidden">

            <!-- PANE 1: LEFT SIDEBAR (Accounts & Unified Filters) -->
            <aside class="w-64 border-r border-white/10 bg-black/25 flex flex-col justify-between p-3.5 shrink-0 hidden md:flex">
                <div>
                    <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
                        <div class="flex items-center gap-2">
                            <span onclick="lockApp()" class="w-3 h-3 rounded-full bg-[#FF5F56] cursor-pointer" title="Lock"></span>
                            <span class="w-3 h-3 rounded-full bg-[#FFBD2E]"></span>
                            <span onclick="syncAllAccounts()" class="w-3 h-3 rounded-full bg-[#27C93F] cursor-pointer" title="Sync All"></span>
                        </div>
                        <button onclick="openComposeModal()" class="px-3 py-1 rounded-full bg-apple-blue hover:bg-apple-blueHover text-white text-xs font-medium flex items-center gap-1.5 shadow-md">
                            <i class="fa-solid fa-pen-to-square"></i> Compose
                        </button>
                    </div>

                    <!-- Unified Inboxes -->
                    <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 px-2 mb-1.5">Unified Mailboxes</p>
                    <nav class="space-y-1 mb-5">
                        <button onclick="selectMailbox('all')" id="nav-all" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium bg-apple-blue text-white">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-inbox"></i> All Inboxes (Combined)</span>
                            <span id="count-all" class="px-2 py-0.5 rounded-full bg-black/20">0</span>
                        </button>
                        <button onclick="selectMailbox('starred')" id="nav-starred" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5">
                            <span class="flex items-center gap-2.5"><i class="fa-solid fa-star text-amber-400"></i> Starred</span>
                            <span id="count-starred" class="px-2 py-0.5 rounded-full bg-white/5">0</span>
                        </button>
                    </nav>

                    <!-- Connected Email Accounts -->
                    <div class="flex items-center justify-between px-2 mb-2">
                        <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Connected Accounts</p>
                        <button onclick="openAccountModal()" class="text-xs text-apple-blue hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Add
                        </button>
                    </div>
                    <div id="accounts-list" class="space-y-1 max-h-60 overflow-y-auto"></div>
                </div>

                <!-- Sync & Add Account Buttons -->
                <div class="space-y-2 pt-3 border-t border-white/10">
                    <button onclick="syncAllAccounts()" id="sync-btn" class="w-full py-2.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 text-xs font-semibold flex items-center justify-center gap-2 transition">
                        <i id="sync-icon" class="fa-solid fa-rotate"></i>
                        <span id="sync-label">Sync All Accounts Now</span>
                    </button>
                    <button onclick="openAccountModal()" class="w-full py-2 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user-plus text-apple-blue"></i> Add Email Account
                    </button>
                </div>
            </aside>

            <!-- PANE 2: MIDDLE THREAD LIST (Combined Stream) -->
            <section class="w-full md:w-80 lg:w-96 border-r border-white/10 flex flex-col h-full shrink-0 bg-black/10">
                <div class="p-3 border-b border-white/10 space-y-2">
                    <div class="flex items-center justify-between">
                        <h2 id="current-folder-title" class="font-semibold text-sm flex items-center gap-2">
                            <i class="fa-solid fa-layer-group text-apple-blue"></i> All Inboxes
                        </h2>
                        <div class="flex items-center gap-1.5">
                            <button onclick="syncAllAccounts()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/15 flex items-center justify-center text-xs text-emerald-400" title="Sync Emails">
                                <i class="fa-solid fa-rotate"></i>
                            </button>
                            <button onclick="openAccountModal()" class="md:hidden w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs text-apple-blue" title="Add Account">
                                <i class="fa-solid fa-user-plus"></i>
                            </button>
                            <button onclick="openComposeModal()" class="md:hidden w-8 h-8 rounded-full bg-apple-blue text-white flex items-center justify-center text-xs" title="Compose">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                        </div>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400"></i>
                        <input id="search-mail" type="text" oninput="renderEmailList()" placeholder="Search sender, subject, text..." class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-black/30 border border-white/15 text-xs focus:outline-none focus:border-apple-blue">
                    </div>
                </div>

                <div id="email-list-container" class="flex-1 overflow-y-auto divide-y divide-white/5"></div>
            </section>

            <!-- PANE 3: RIGHT EMAIL READER & INSTANT REPLY -->
            <main id="reader-pane" class="hidden md:flex flex-1 flex-col h-full min-w-0 bg-black/5">
                <div id="empty-reader" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400">
                    <div class="w-16 h-16 rounded-3xl bg-white/5 border border-white/10 flex items-center justify-center text-2xl text-apple-blue mb-3">
                        <i class="fa-regular fa-envelope-open"></i>
                    </div>
                    <p class="text-sm font-medium text-slate-200">Select an email to read & reply</p>
                    <p class="text-xs mt-1 max-w-xs">All your connected email accounts appear together in one unified stream.</p>
                </div>

                <div id="active-reader" class="hidden flex-col h-full">
                    <!-- Reader Header -->
                    <div class="p-4 border-b border-white/10 flex items-start justify-between gap-3 bg-white/5">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <button onclick="closeMobileReader()" class="md:hidden px-2 py-1 rounded-lg bg-white/10 text-xs mr-1">
                                    <i class="fa-solid fa-arrow-left"></i>
                                </button>
                                <span id="read-account-pill" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-apple-blue/25 text-blue-300 border border-blue-400/20"></span>
                                <span id="read-date" class="text-[11px] text-slate-400"></span>
                            </div>
                            <h1 id="read-subject" class="text-base sm:text-lg font-semibold text-white selectable-text"></h1>
                            <p id="read-from" class="text-xs text-slate-300 mt-1 selectable-text"></p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button id="read-reply-btn" class="px-3 py-1.5 rounded-xl bg-apple-blue hover:bg-apple-blueHover text-white text-xs font-medium flex items-center gap-1.5">
                                <i class="fa-solid fa-reply"></i> Reply
                            </button>
                            <button id="read-delete-btn" class="w-8 h-8 rounded-xl bg-red-500/15 hover:bg-red-500/25 text-red-400 flex items-center justify-center text-xs">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Email Body -->
                    <div id="read-body" class="flex-1 overflow-y-auto p-5 text-sm leading-relaxed selectable-text bg-white text-slate-900"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- 3. ADD EMAIL ACCOUNT MODAL (Gmail, Outlook, Custom IMAP) -->
    <div id="account-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 border border-white/15 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-semibold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-envelope-circle-check text-apple-blue"></i> Connect Email Account
                </h3>
                <button onclick="closeAccountModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Quick Presets -->
            <div class="grid grid-cols-3 gap-2 text-xs">
                <button type="button" onclick="applyPreset('gmail')" class="py-2 rounded-xl bg-white/10 hover:bg-white/15 font-medium">
                    <i class="fa-brands fa-google text-red-400 mr-1"></i> Gmail
                </button>
                <button type="button" onclick="applyPreset('outlook')" class="py-2 rounded-xl bg-white/10 hover:bg-white/15 font-medium">
                    <i class="fa-brands fa-microsoft text-blue-400 mr-1"></i> Outlook
                </button>
                <button type="button" onclick="applyPreset('yahoo')" class="py-2 rounded-xl bg-white/10 hover:bg-white/15 font-medium">
                    <i class="fa-brands fa-yahoo text-purple-400 mr-1"></i> Yahoo
                </button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-300 block mb-1">Account Label (e.g. Personal, Work)</label>
                    <input id="acc-label" type="text" placeholder="Work Gmail" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15">
                </div>
                <div>
                    <label class="text-slate-300 block mb-1">Email Address</label>
                    <input id="acc-email" type="email" placeholder="you@gmail.com" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15">
                </div>
                <div>
                    <label class="text-slate-300 block mb-1">App Password (16-digit App Password for Gmail/Outlook)</label>
                    <input id="acc-pass" type="password" placeholder="xxxx xxxx xxxx xxxx" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15 font-mono">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-slate-400 block mb-1">IMAP Host</label>
                        <input id="acc-imap" type="text" value="imap.gmail.com" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">SMTP Host</label>
                        <input id="acc-smtp" type="text" value="smtp.gmail.com" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15">
                    </div>
                </div>
            </div>

            <button onclick="saveNewAccount()" class="w-full py-2.5 rounded-xl bg-apple-blue hover:bg-apple-blueHover text-white text-xs font-semibold shadow-lg">
                Connect & Sync Account
            </button>
        </div>
    </div>

    <!-- 4. COMPOSE / REPLY MODAL -->
    <div id="compose-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-6 border border-white/15 shadow-2xl space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="font-semibold text-base text-white">Send Email</h3>
                <button onclick="closeComposeModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Send From Account</label>
                    <select id="comp-from" class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/15 text-white"></select>
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">To</label>
                    <input id="comp-to" type="email" placeholder="recipient@example.com" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15">
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">Subject</label>
                    <input id="comp-subject" type="text" placeholder="Subject..." class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/15">
                </div>
                <div>
                    <textarea id="comp-body" rows="6" placeholder="Write your message..." class="w-full p-3 rounded-xl bg-black/40 border border-white/15"></textarea>
                </div>
            </div>
            <button onclick="sendEmailNow()" id="send-mail-btn" class="w-full py-2.5 rounded-xl bg-apple-blue hover:bg-apple-blueHover text-white text-xs font-semibold">
                <i class="fa-solid fa-paper-plane mr-1"></i> Send Email
            </button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-black/90 text-white border border-white/15 text-xs font-medium opacity-0 pointer-events-none transition-all"></div>

    <script>
        // আপনার Supabase ক্রেডেনশিয়াল
        const SUPABASE_URL = "https://wkivxhqomayuksyaqwmi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndraXZ4aHFvbWF5dWtzeWFxd21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDExMTAsImV4cCI6MjEwNzk3NzExMH0.sbuPDzNLi9DU0c3Pe0X0xl5ebpaMk02eE-KPZUUHEhc";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const PIN = "5109";
        let currentPin = "";
        let accounts = [];
        let emails = [];
        let activeFilter = "all";
        let selectedEmailId = null;

        // PIN Lock
        function pressPin(d) {
            if (currentPin.length >= 4) return;
            currentPin += d;
            renderDots();
            if (currentPin.length === 4) {
                if (currentPin === PIN) {
                    document.getElementById("lock-screen").classList.add("opacity-0", "pointer-events-none");
                    const ws = document.getElementById("app-workspace");
                    ws.classList.remove("opacity-0", "pointer-events-none");
                    loadInitialData();
                } else {
                    setTimeout(() => { currentPin = ""; renderDots(); }, 400);
                }
            }
        }
        function backPin() { currentPin = currentPin.slice(0, -1); renderDots(); }
        function resetPin() { currentPin = ""; renderDots(); }
        function renderDots() {
            document.querySelectorAll("#pin-dots .dot").forEach((el, i) => {
                el.className = i < currentPin.length
                    ? "dot w-3.5 h-3.5 rounded-full bg-white border-2 border-white"
                    : "dot w-3.5 h-3.5 rounded-full border-2 border-white/60";
            });
        }
        function lockApp() {
            currentPin = "";
            renderDots();
            document.getElementById("lock-screen").classList.remove("opacity-0", "pointer-events-none");
            document.getElementById("app-workspace").classList.add("opacity-0", "pointer-events-none");
        }
        window.addEventListener("keydown", (e) => {
            if (!document.getElementById("lock-screen").classList.contains("pointer-events-none")) {
                if (e.key >= "0" && e.key <= "9") pressPin(e.key);
                if (e.key === "Backspace") backPin();
            }
        });

        // Load Data from Supabase + Realtime Subscription
        async function loadInitialData() {
            const { data: accData } = await sb.from('mail_accounts').select('*').order('created_at', { ascending: true });
            accounts = accData || [];
            renderAccounts();

            const { data: mailData } = await sb.from('unified_emails').select('*').order('date_ts', { ascending: false });
            emails = mailData || [];
            renderEmailList();

            sb.channel('unified-mail-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'unified_emails' }, () => {
                    refreshFromSupabase();
                })
                .subscribe();
        }

        async function refreshFromSupabase() {
            const { data } = await sb.from('unified_emails').select('*').order('date_ts', { ascending: false });
            if (data) {
                emails = data;
                renderEmailList();
            }
        }

        function renderAccounts() {
            const list = document.getElementById("accounts-list");
            const select = document.getElementById("comp-from");
            list.innerHTML = accounts.map(a => `
                <div onclick="selectMailbox('${a.id}')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium cursor-pointer hover:bg-white/10 ${activeFilter === a.id ? 'bg-white/15 text-white' : 'text-slate-300'}">
                    <span class="truncate flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                        ${a.label || a.email}
                    </span>
                    <button onclick="event.stopPropagation(); removeAccount('${a.id}')" class="text-slate-500 hover:text-red-400">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join("");

            select.innerHTML = accounts.map(a => `<option value="${a.id}">${a.label || a.email} (${a.email})</option>`).join("");
        }

        function selectMailbox(filter) {
            activeFilter = filter;
            renderAccounts();
            renderEmailList();
        }

        function renderEmailList() {
            const container = document.getElementById("email-list-container");
            const q = (document.getElementById("search-mail")?.value || "").toLowerCase();

            document.getElementById("count-all").textContent = emails.length;
            document.getElementById("count-starred").textContent = emails.filter(e => e.starred).length;

            const filtered = emails.filter(e => {
                if (activeFilter === "starred" && !e.starred) return false;
                if (activeFilter !== "all" && activeFilter !== "starred" && e.account_id !== activeFilter) return false;
                if (q && !(e.subject || "").toLowerCase().includes(q) && !(e.from_name || "").toLowerCase().includes(q) && !(e.snippet || "").toLowerCase().includes(q)) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">No emails found. Click "Add Email Account" or "Sync All" to fetch emails.</div>`;
                return;
            }

            container.innerHTML = filtered.map(e => {
                const dateStr = new Date(Number(e.date_ts)).toLocaleDateString([], { month: 'short', day: 'numeric' });
                return `
                    <div onclick="openEmail('${e.id}')" class="p-3.5 cursor-pointer hover:bg-white/5 transition ${selectedEmailId === e.id ? 'bg-apple-blue/20 border-l-4 border-apple-blue' : ''}">
                        <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1">
                            <span class="px-2 py-0.5 rounded-md bg-white/5 text-blue-300 font-medium truncate max-w-[160px]">${e.account_email}</span>
                            <span>${dateStr}</span>
                        </div>
                        <h4 class="text-xs font-semibold text-white truncate">${e.from_name || e.from_address}</h4>
                        <p class="text-xs text-slate-200 truncate mt-0.5">${e.subject}</p>
                        <p class="text-[11px] text-slate-400 truncate mt-0.5">${e.snippet || ''}</p>
                    </div>
                `;
            }).join("");
        }

        function openEmail(id) {
            selectedEmailId = id;
            renderEmailList();
            const mail = emails.find(m => m.id === id);
            if (!mail) return;

            document.getElementById("reader-pane").classList.remove("hidden");
            document.getElementById("reader-pane").classList.add("flex", "fixed", "inset-0", "z-40", "md:static");
            document.getElementById("empty-reader").classList.add("hidden");
            const active = document.getElementById("active-reader");
            active.classList.remove("hidden");
            active.classList.add("flex");

            document.getElementById("read-account-pill").textContent = `To: ${mail.account_email}`;
            document.getElementById("read-date").textContent = new Date(Number(mail.date_ts)).toLocaleString();
            document.getElementById("read-subject").textContent = mail.subject;
            document.getElementById("read-from").textContent = `From: ${mail.from_name} <${mail.from_address}>`;
            document.getElementById("read-body").innerHTML = mail.body_html || mail.body_text;

            document.getElementById("read-reply-btn").onclick = () => {
                openComposeModal(mail.account_id, mail.from_address, `Re: ${mail.subject}`);
            };
            document.getElementById("read-delete-btn").onclick = async () => {
                await sb.from('unified_emails').delete().eq('id', mail.id);
                emails = emails.filter(x => x.id !== mail.id);
                closeMobileReader();
                renderEmailList();
                showToast("Email deleted");
            };
        }

        function closeMobileReader() {
            document.getElementById("reader-pane").classList.add("hidden", "md:flex");
            document.getElementById("reader-pane").classList.remove("fixed", "inset-0", "z-40");
        }

        // Sync All Connected IMAP Accounts via Vercel Serverless Function
        async function syncAllAccounts() {
            if (accounts.length === 0) {
                showToast("Please add an email account first!");
                openAccountModal();
                return;
            }
            const icon = document.getElementById("sync-icon");
            const label = document.getElementById("sync-label");
            icon.classList.add("fa-spin");
            label.textContent = "Syncing Inboxes...";

            for (const acc of accounts) {
                try {
                    const res = await fetch('/api/mail', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'sync', account: acc })
                    });
                    const result = await res.json();
                    if (result.success && result.emails?.length > 0) {
                        await sb.from('unified_emails').upsert(result.emails, { onConflict: 'id' });
                    }
                } catch (e) {
                    console.error("Sync error for", acc.email, e);
                }
            }

            await refreshFromSupabase();
            icon.classList.remove("fa-spin");
            label.textContent = "Sync All Accounts Now";
            showToast("All Inboxes Synced!");
        }

        // Account Modal Presets
        function applyPreset(type) {
            if (type === 'gmail') {
                document.getElementById("acc-imap").value = "imap.gmail.com";
                document.getElementById("acc-smtp").value = "smtp.gmail.com";
            } else if (type === 'outlook') {
                document.getElementById("acc-imap").value = "outlook.office365.com";
                document.getElementById("acc-smtp").value = "smtp.office365.com";
            } else if (type === 'yahoo') {
                document.getElementById("acc-imap").value = "imap.mail.yahoo.com";
                document.getElementById("acc-smtp").value = "smtp.mail.yahoo.com";
            }
        }

        function openAccountModal() {
            document.getElementById("account-modal").classList.remove("hidden");
            document.getElementById("account-modal").classList.add("flex");
        }
        function closeAccountModal() {
            document.getElementById("account-modal").classList.add("hidden");
            document.getElementById("account-modal").classList.remove("flex");
        }

        async function saveNewAccount() {
            const label = document.getElementById("acc-label").value.trim();
            const email = document.getElementById("acc-email").value.trim();
            const app_password = document.getElementById("acc-pass").value.trim();
            const imap_host = document.getElementById("acc-imap").value.trim();
            const smtp_host = document.getElementById("acc-smtp").value.trim();

            if (!email || !app_password) {
                showToast("Email and App Password required");
                return;
            }

            const newAcc = {
                id: "acc_" + Date.now(),
                email,
                label: label || email.split("@")[0],
                imap_host,
                imap_port: 993,
                smtp_host,
                smtp_port: 465,
                app_password,
                created_at: Date.now()
            };

            await sb.from('mail_accounts').insert([newAcc]);
            accounts.push(newAcc);
            renderAccounts();
            closeAccountModal();
            showToast("Account Added! Syncing now...");
            syncAllAccounts();
        }

        async function removeAccount(id) {
            await sb.from('mail_accounts').delete().eq('id', id);
            await sb.from('unified_emails').delete().eq('account_id', id);
            accounts = accounts.filter(a => a.id !== id);
            emails = emails.filter(e => e.account_id !== id);
            renderAccounts();
            renderEmailList();
            showToast("Account removed");
        }

        // Compose & Reply
        function openComposeModal(accountId = "", to = "", subject = "") {
            if (accounts.length === 0) {
                showToast("Connect an email account first!");
                return;
            }
            const modal = document.getElementById("compose-modal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            if (accountId) document.getElementById("comp-from").value = accountId;
            document.getElementById("comp-to").value = to;
            document.getElementById("comp-subject").value = subject;
            document.getElementById("comp-body").value = "";
        }
        function closeComposeModal() {
            document.getElementById("compose-modal").classList.add("hidden");
            document.getElementById("compose-modal").classList.remove("flex");
        }

        async function sendEmailNow() {
            const accId = document.getElementById("comp-from").value;
            const account = accounts.find(a => a.id === accId);
            const to = document.getElementById("comp-to").value.trim();
            const subject = document.getElementById("comp-subject").value.trim();
            const body = document.getElementById("comp-body").value.trim();

            if (!account || !to) return;
            const btn = document.getElementById("send-mail-btn");
            btn.textContent = "Sending...";

            const res = await fetch('/api/mail', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send', account, mailData: { to, subject, body } })
            });
            const out = await res.json();
            btn.textContent = "Send Email";

            if (out.success) {
                closeComposeModal();
                showToast("Email Sent Successfully!");
            } else {
                showToast("Error: " + (out.error || "Failed"));
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.remove("opacity-0");
            setTimeout(() => t.classList.add("opacity-0"), 2600);
        }
    </script>
</body>
</html>
